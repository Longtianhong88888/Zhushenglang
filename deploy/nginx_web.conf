# 腾讯云 Nginx 站点配置：托管网页仪表盘
# 放到 /etc/nginx/conf.d/mainrise_web.conf 后执行:
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name _;          # 换成你的域名（或留空用 IP 访问）

    root /path/to/chaoduan/output/web;   # 改成实际路径
    index index.html;

    # 简单访问口令（setup_server.sh 会自动生成口令文件）
    auth_basic "主升浪跟踪";
    auth_basic_user_file /etc/nginx/.mainrise_htpasswd;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    # 标的详情页（分时/K线）：反代到 monitor 进程内的本地服务
    location /stock/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 强制刷新（重新生成网页/复盘/盯盘）
    location /refresh {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;   # page=live 触发分钟级全市场扫描，默认 60s 会 504
    }

    # 生产环境建议配 HTTPS：腾讯云申请免费 SSL 证书后
    # listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;
    # 并把 80 端口 301 跳转到 https。
}
